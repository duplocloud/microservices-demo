apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
 - adservice.yaml
 - cartservice.yaml
 - checkoutservice.yaml
 - currencyservice.yaml
 - emailservice.yaml
 - frontend.yaml
# - loadgenerator.yaml # During development, the loadgenerator module inside skaffold.yaml will be used.
 - paymentservice.yaml
 - productcatalogservice.yaml
 - recommendationservice.yaml
 - shippingservice.yaml
 # Generated by DuploCloud kube-deploy — duplo-ingress + patches for ECR images and LoadBalancer neutralization.
 - duplo-ingress.yaml

namespace: mircoservices-app

images:
 - name: adservice
   newName: 805863115079.dkr.ecr.us-east-1.amazonaws.com/microservices-demo/adservice
   newTag: main
 - name: cartservice
   newName: 805863115079.dkr.ecr.us-east-1.amazonaws.com/microservices-demo/cartservice
   newTag: main
 - name: checkoutservice
   newName: 805863115079.dkr.ecr.us-east-1.amazonaws.com/microservices-demo/checkoutservice
   newTag: main
 - name: currencyservice
   newName: 805863115079.dkr.ecr.us-east-1.amazonaws.com/microservices-demo/currencyservice
   newTag: main
 - name: emailservice
   newName: 805863115079.dkr.ecr.us-east-1.amazonaws.com/microservices-demo/emailservice
   newTag: main
 - name: frontend
   newName: 805863115079.dkr.ecr.us-east-1.amazonaws.com/microservices-demo/frontend
   newTag: main
 - name: paymentservice
   newName: 805863115079.dkr.ecr.us-east-1.amazonaws.com/microservices-demo/paymentservice
   newTag: main
 - name: productcatalogservice
   newName: 805863115079.dkr.ecr.us-east-1.amazonaws.com/microservices-demo/productcatalogservice
   newTag: main
 - name: recommendationservice
   newName: 805863115079.dkr.ecr.us-east-1.amazonaws.com/microservices-demo/recommendationservice
   newTag: main
 - name: shippingservice
   newName: 805863115079.dkr.ecr.us-east-1.amazonaws.com/microservices-demo/shippingservice
   newTag: main

patches:
 - path: patches/frontend-external-clusterip.yaml
   target:
     kind: Service
     name: frontend-external

commonLabels:
 app.kubernetes.io/managed-by: duplo-kube-deploy

