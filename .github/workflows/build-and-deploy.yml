name: Build and Deploy (demo -> AWS EKS dev)

on:
  push:
    branches: [main]
    paths:
      - 'src/frontend/**'
      - 'devops/Dockerfile'
      - 'deploy/k8s/**'
      - '.github/workflows/build-and-deploy.yml'
  workflow_dispatch: {}

permissions:
  id-token: write   # required for OIDC federation to AWS
  contents: read

env:
  AWS_REGION: <AWS_REGION>                 # e.g. us-east-1
  ECR_REPOSITORY: demo
  EKS_CLUSTER_NAME: <CLUSTER_NAME>
  IMAGE_TAG: ${{ github.sha }}

jobs:
  test:
    name: Lint & Test (Go frontend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: src/frontend/go.sum

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

  build-and-push:
    name: Build & push image to ECR
    needs: test
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::<AWS_ACCOUNT_ID>:role/<GITHUB_ACTIONS_ECR_ROLE_NAME>
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: src/frontend
          file: devops/Dockerfile
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - id: image
        run: echo "image=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}" >> "$GITHUB_OUTPUT"

  deploy-dev:
    name: Deploy to EKS (dev)
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::<AWS_ACCOUNT_ID>:role/<GITHUB_ACTIONS_EKS_ROLE_NAME>
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER_NAME }} --region ${{ env.AWS_REGION }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.30.0'

      - name: Set image in kustomize overlay
        working-directory: deploy/k8s/overlays/dev
        run: |
          kubectl kustomize . > /tmp/rendered.yaml
          # Update the image reference for this deploy using kustomize edit
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          ./kustomize edit set image demo=${{ needs.build-and-push.outputs.image }}

      - name: Deploy manifests
        run: kubectl apply -k deploy/k8s/overlays/dev

      - name: Wait for rollout
        run: kubectl rollout status deployment/demo -n demo-dev --timeout=180s
