# Generated by DuploCloud kube-deploy.
#
# Builds and pushes every discovered Online Boutique service to this account's ECR, one repository
# per service (microservices-demo/<service>). The repo's own build-images.yml pushes to Google
# Artifact Registry and is dispatched by a different platform's extension, so it doesn't cover ECR —
# this workflow is additive, not a replacement.
name: duplo-build

on:
  push:
    branches:
      - main
      - 'duplo/kube-deploy-*'
  workflow_dispatch: {}

env:
  AWS_REGION: us-east-1
  REGISTRY: 813590939111.dkr.ecr.us-east-1.amazonaws.com
  REPO_PREFIX: microservices-demo

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: adservice
            context: src/adservice
            dockerfile: src/adservice/Dockerfile
          - service: cartservice
            context: src/cartservice/src
            dockerfile: src/cartservice/src/Dockerfile
          - service: checkoutservice
            context: src/checkoutservice
            dockerfile: src/checkoutservice/Dockerfile
          - service: currencyservice
            context: src/currencyservice
            dockerfile: src/currencyservice/Dockerfile
          - service: emailservice
            context: src/emailservice
            dockerfile: src/emailservice/Dockerfile
          - service: frontend
            context: src/frontend
            dockerfile: src/frontend/Dockerfile
          - service: loadgenerator
            context: src/loadgenerator
            dockerfile: src/loadgenerator/Dockerfile
          - service: paymentservice
            context: src/paymentservice
            dockerfile: src/paymentservice/Dockerfile
          - service: productcatalogservice
            context: src/productcatalogservice
            dockerfile: src/productcatalogservice/Dockerfile
          - service: recommendationservice
            context: src/recommendationservice
            dockerfile: src/recommendationservice/Dockerfile
          - service: shippingservice
            context: src/shippingservice
            dockerfile: src/shippingservice/Dockerfile
          - service: shoppingassistantservice
            context: src/shoppingassistantservice
            dockerfile: src/shoppingassistantservice/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Compute tags
        id: tags
        run: |
          BRANCH_SLUG=$(echo "${GITHUB_REF_NAME}" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9._-]+/-/g; s/^[.-]+//' | cut -c1-100)
          SHA_TAG="sha-$(echo "${GITHUB_SHA}" | cut -c1-12)"
          echo "branch_slug=${BRANCH_SLUG}" >> "$GITHUB_OUTPUT"
          echo "sha_tag=${SHA_TAG}" >> "$GITHUB_OUTPUT"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.ACCESSKEYID }}
          aws-secret-access-key: ${{ secrets.SECRETACCESSKEY }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      - name: Ensure ECR repository exists
        run: |
          aws ecr describe-repositories --repository-names "${REPO_PREFIX}/${{ matrix.service }}" \
            --region "${AWS_REGION}" \
            || aws ecr create-repository --repository-name "${REPO_PREFIX}/${{ matrix.service }}" \
                 --region "${AWS_REGION}"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.REPO_PREFIX }}/${{ matrix.service }}:${{ steps.tags.outputs.branch_slug }}
            ${{ env.REGISTRY }}/${{ env.REPO_PREFIX }}/${{ matrix.service }}:${{ steps.tags.outputs.sha_tag }}
