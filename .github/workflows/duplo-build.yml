# Generated by DuploCloud kube-deploy.
name: duplo-build

on:
  push:
    branches:
      - main
      - duplo/kube-deploy-**
  workflow_dispatch: {}

env:
  AWS_REGION: us-east-1
  REGISTRY: 805863115079.dkr.ecr.us-east-1.amazonaws.com
  REPO_PREFIX: 805863115079.dkr.ecr.us-east-1.amazonaws.com/microservices-demo

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: adservice
            context: src/adservice
            dockerfile: src/adservice/Dockerfile
          - service: cartservice
            context: src/cartservice/src
            dockerfile: src/cartservice/src/Dockerfile
          - service: checkoutservice
            context: src/checkoutservice
            dockerfile: src/checkoutservice/Dockerfile
          - service: currencyservice
            context: src/currencyservice
            dockerfile: src/currencyservice/Dockerfile
          - service: emailservice
            context: src/emailservice
            dockerfile: src/emailservice/Dockerfile
          - service: frontend
            context: src/frontend
            dockerfile: src/frontend/Dockerfile
          - service: paymentservice
            context: src/paymentservice
            dockerfile: src/paymentservice/Dockerfile
          - service: productcatalogservice
            context: src/productcatalogservice
            dockerfile: src/productcatalogservice/Dockerfile
          - service: recommendationservice
            context: src/recommendationservice
            dockerfile: src/recommendationservice/Dockerfile
          - service: shippingservice
            context: src/shippingservice
            dockerfile: src/shippingservice/Dockerfile
          - service: shoppingassistantservice
            context: src/shoppingassistantservice
            dockerfile: src/shoppingassistantservice/Dockerfile

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.ACCESSKEYID }}
          aws-secret-access-key: ${{ secrets.SECRETACCESSKEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Create ECR repository if missing
        run: |
          aws ecr describe-repositories \
            --repository-names "microservices-demo/${{ matrix.service }}" \
            --region "$AWS_REGION" 2>/dev/null || \
          aws ecr create-repository \
            --repository-name "microservices-demo/${{ matrix.service }}" \
            --region "$AWS_REGION"

      - name: Build and push ${{ matrix.service }}
        run: |
          BRANCH_SLUG="${GITHUB_REF_NAME//[^a-z0-9._-]/-}"
          BRANCH_SLUG="${BRANCH_SLUG,,}"
          SHA_TAG="sha-$(echo "$GITHUB_SHA" | cut -c1-12)"
          IMAGE_REPO="${REPO_PREFIX}/${{ matrix.service }}"
          docker build \
            -t "${IMAGE_REPO}:${BRANCH_SLUG}" \
            -t "${IMAGE_REPO}:${SHA_TAG}" \
            -f "${{ matrix.dockerfile }}" \
            "${{ matrix.context }}"
          docker push "${IMAGE_REPO}:${BRANCH_SLUG}"
          docker push "${IMAGE_REPO}:${SHA_TAG}"
          echo "### Pushed \`${IMAGE_REPO}:${BRANCH_SLUG}\` and \`${IMAGE_REPO}:${SHA_TAG}\`" >> "$GITHUB_STEP_SUMMARY"
