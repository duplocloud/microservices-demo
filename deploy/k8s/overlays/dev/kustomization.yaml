apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: demo-dev

resources:
  - ../../base
  - namespace.yaml

patches:
  - path: deployment-patch.yaml

images:
  - name: demo
    newName: <AWS_ACCOUNT_ID>.dkr.ecr.<AWS_REGION>.amazonaws.com/demo
    newTag: latest

commonLabels:
  environment: dev
